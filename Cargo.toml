[workspace]
resolver = "2"
members = [
    "crates/glyph-core",
    "crates/glyph-cli",
    "crates/glyph-kg",
    "crates/glyph-diag",
    "tools/glyph-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-glyph"
homepage = "https://github.com/tpt-solutions/tpt-glyph"
description = "A secure, sandboxed, multi-threaded PDF/PostScript rendering engine — the Ghostscript successor."

[workspace.dependencies]
glyph-core = { path = "crates/glyph-core", version = "0.1.0" }
glyph-kg = { path = "crates/glyph-kg", version = "0.1.0" }

# Rendering backends
wgpu = "0.20"
raqote = "0.13"
vello = "0.3"

# PDF structure parsing
pdf = "0.9"

# Concurrency
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"

# CLI / argument parsing
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
