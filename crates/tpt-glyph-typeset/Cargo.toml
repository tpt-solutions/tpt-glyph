[package]
name = "tpt-glyph-typeset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-level document typesetting: paragraph layout, pagination, and page breaks, with inline tpt-glyph-math support, emitted as tpt-glyph-core draw commands."
readme = "README.md"
keywords = ["typesetting", "layout", "pagination", "text", "document"]
categories = ["text-processing", "graphics"]

[dependencies]
tpt-glyph-font = { workspace = true, features = ["std"] }
tpt-glyph-math = { path = "../tpt-glyph-math", version = "0.1.0", features = ["std"] }
tpt-glyph-core.workspace = true
