[package]
name = "tpt-glyph-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core rendering engine for TPT Glyph: graphics state, geometry, and pipeline abstractions."
readme = "README.md"
keywords = ["pdf", "postscript", "rendering", "graphics", "rasterizer"]
categories = ["graphics", "rendering", "multimedia::images"]

 [dependencies]
rayon = { workspace = true, optional = true }
# Declared inline (not via workspace) so `default-features = false` takes effect:
# serde must be std-free here for the no_std build. (`thiserror` is intentionally
# absent — its derive always emits `impl std::error::Error`, see src/error.rs.)
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
image = { version = "0.25", optional = true }
# `std`-only f64 methods (round/sqrt/sin/cos/...) under `no_std`. In `std`
# builds the crate's own `math` shim delegates to the inherent methods and
# this dependency is compiled but unused.
libm = "0.2"

# Optional accelerated backends (Phase 6).
raqote = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# Path tessellation (fill/stroke -> triangles) for the wgpu backend.
lyon = { version = "1.0", optional = true }
# Blocks on wgpu's async adapter/device/buffer-map futures; the rasterizer
# is a synchronous `Rasterizer::rasterize` call, so there's no async runtime
# to hand these off to.
pollster = { version = "0.3", optional = true }

[features]
default = ["std"]
# `std` re-enables the platform/std-only conveniences (file export, the rayon
# thread pool). With `--no-default-features` the crate is `#![no_std]` +
# `alloc`, so it can target WASM/embedded; the reference rasterizer, geometry,
# and immutable graphics state remain fully available.
std = ["dep:rayon", "dep:image"]
# CPU-backed rasterization via raqote; used as the deterministic fallback path.
raqote-backend = ["dep:raqote", "std"]
# GPU-backed rasterization via wgpu: tessellates fills/strokes (lyon) and
# rasterizes them on a headless (surfaceless) wgpu device.
wgpu-backend = ["dep:wgpu", "dep:lyon", "dep:pollster", "std"]

[dev-dependencies]
criterion = "0.5"
rayon = { workspace = true }

[[bench]]
name = "backends"
harness = false
