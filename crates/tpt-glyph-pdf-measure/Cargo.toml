keywords = ["pdf", "measure", "metrics", "geometry", "typography"]
categories = ["text-processing", "graphics"]

[dependencies]
tpt-glyph-pdf-ir = { workspace = true, features = ["std"] }
tpt-glyph-font = { workspace = true, features = ["std"] }
