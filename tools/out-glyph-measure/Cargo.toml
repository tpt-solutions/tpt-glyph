[package]
name = "out-glyph-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Scaled line-measurement CLI: reports real-world lengths of PDF page geometry given a per-page drawing scale (e.g. 1:100, 1/4in=1ft)."
publish = false
readme = "README.md"
keywords = ["pdf", "measure", "scale", "geometry", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "out-glyph-measure"
path = "src/main.rs"

[dependencies]
tpt-glyph-pdf-ir = { workspace = true, features = ["std"] }
tpt-glyph-pdf-parser.workspace = true
tpt-glyph-pdf-measure.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
tpt-glyph-pdf-writer.workspace = true
